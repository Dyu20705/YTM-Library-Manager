name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r python/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build TypeScript & Vite bundle
        run: npm run build

      - name: Run Invariant Tests (INV-001 - INV-023)
        run: npm run test:invariants

      - name: Run Implementation Gate Tests (GATE-01 - GATE-05)
        run: npm run test:gates

      - name: Run All Tests
        run: npm test
