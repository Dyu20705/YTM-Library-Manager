name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          python -c "import os, subprocess; p = '.venv/Scripts/python.exe' if os.name == 'nt' else '.venv/bin/python3'; subprocess.check_call([p, '-m', 'pip', 'install', '-r', 'python/requirements.txt'])"

      - name: Install Node dependencies
        run: npm ci

      - name: Build TypeScript & Vite bundle
        run: npm run build

      - name: Run Invariant Tests (INV-001 - INV-023)
        run: npm run test:invariants

      - name: Run Implementation Gate Tests (GATE-01 - GATE-05)
        run: npm run test:gates

      - name: Run All Tests
        run: npm test

      - name: Run Python Bridge Tests
        run: npm run test:bridge
